<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101d"><title>Actualizar Rage Training</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#07101d;color:#fff;font:16px/1.5 Arial,sans-serif;text-align:center}main{width:min(460px,100%);padding:28px;border:1px solid #33465e;border-radius:18px;background:#0d192a}img{max-width:160px}h1{font-size:24px}p{color:#b9c5d6}button{padding:14px;background:#f15a24;border:0;border-radius:9px;color:white;font:inherit;font-weight:bold;cursor:pointer}</style></head>
<body><main><img src="rage-logo.png" alt="Rage Training"><h1>Actualizar Rage Training</h1><p id="estado">Cierra primero las otras pestañas y la aplicación de Rage. Esta actualización solo renueva archivos de la app: no borra clientes, bonos, sesiones ni copias locales.</p><button id="actualizar" type="button">Actualizar y abrir v2.4.58</button></main>
<script>
const button=document.getElementById('actualizar');
button.onclick=async function(){
  button.disabled=true;
  const text=document.getElementById('estado');
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  try{
    text.textContent='Comprobando la conexión y la actualización…';
    const response=await fetch('persistencia-v2.4.58.js?check='+Date.now(),{cache:'no-store',signal:controller.signal});
    if(!response.ok || !(await response.text()).includes('rageTraining:database:v1'))throw new Error('La actualización todavía no está disponible o no hay conexión.');
    const scope=new URL('./',location.href).href;
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.filter(r=>r.scope===scope).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('rage-training-v')).map(k=>caches.delete(k)));
    }
    text.textContent='Actualización preparada. Abriendo Rage…';
    location.replace('./?v=24581&fresh='+Date.now());
  }catch(e){text.textContent='No se han borrado datos. '+e.message+' Vuelve a intentarlo con conexión.';button.disabled=false}
  finally{clearTimeout(timer)}
};
</script></body></html>
